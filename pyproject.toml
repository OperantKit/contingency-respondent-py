[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contingency-respondent-py"
version = "0.0.0"
description = "Tier B respondent procedures (contingency-respondent-dsl) as contingency-py respondent expansions, with an OKL v1 writer for their trials."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "OperantKit contributors" },
]
keywords = [
  "behavior-analysis",
  "pavlovian-conditioning",
  "respondent-conditioning",
  "simulation",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "contingency-py @ git+https://github.com/OperantKit/contingency-py.git@rust-engine-only",
  "contingency-respondent-dsl @ git+https://github.com/OperantKit/contingency-respondent-dsl.git@main",
  "session-recorder @ git+https://github.com/OperantKit/session-recorder.git@main",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/contingency_respondent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
