[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "respondent-sim"
version = "0.0.0"
description = "Pavlovian trial expander (Tier B respondent AST -> trial list) and compound-CS Rescorla-Wagner executor that writes OKL v1."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "OperantKit contributors" },
]
keywords = [
  "behavior-analysis",
  "pavlovian-conditioning",
  "respondent-conditioning",
  "rescorla-wagner",
  "simulation",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "contingency-respondent-dsl @ {root:uri}/../../core/contingency-respondent-dsl",
  "session-recorder @ {root:uri}/../../experiment/session-recorder",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "session-analyzer @ {root:uri}/../../analysis/session-analyzer",
]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/respondent_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
